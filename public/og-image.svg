  </text>
  <circle cx="600" cy="400" r="60" fill="url(#accent)" opacity="0.9"/>
  <text x="600" y="408" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fff">
    SIAC
  </text>
  <line x1="300" y1="480" x2="900" y2="480" stroke="#444" stroke-width="2"/>
  <text x="600" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#888">
